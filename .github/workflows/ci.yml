name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: PHP ${{ matrix.php-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        php-version: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Validate PHP syntax
        run: composer lint

      - name: Run test suite
        run: composer test

      - name: Check runtime environment
        run: php bin/sourceslate doctor --json

      - name: Build SourceSlate documentation
        run: php bin/sourceslate build . --config=sourceslate.example.yaml --output=.sourceslate-ci-docs

      - name: Verify deterministic documentation
        run: php bin/sourceslate build . --config=sourceslate.example.yaml --output=.sourceslate-ci-docs --check

  global-install-smoke:
    name: Composer global install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Register checked-out package as a Composer path repository
        run: composer global config repositories.sourceslate path "$GITHUB_WORKSPACE"

      - name: Install SourceSlate globally from the clean Composer home
        run: composer global require "phpwalter/sourceslate:@dev" --no-interaction --prefer-source

      - name: Verify global binary and version
        run: composer global exec sourceslate -- --version
